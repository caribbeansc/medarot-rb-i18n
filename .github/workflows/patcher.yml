name: patcher

# Builds the double-clickable patcher (gui.py) for Windows and macOS on every
# push to main and publishes it to the rolling "latest" release. GitHub-hosted
# runners are free for public repositories, so this costs nothing.
#
# Each executable bundles this repo's code, langs/, and a per-platform hactool
# (ISC-licensed) plus the nsz decompressor — so a player can turn their own
# .xci/.nsp/.xcz/.nsz backup into a patched game with no terminal and no keys
# setup. Nothing from the game is ever bundled.

on:
  push:
    branches: [main]
    # Documentation never ends up inside the executable, so don't rebuild for it.
    # Code and langs/*.json (which are bundled) still trigger a build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'NOTICE'
  workflow_dispatch:

concurrency:
  group: patcher-release
  cancel-in-progress: true

env:
  HACTOOL_VER: "1.4.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MedarotRB-Patcher-Windows
          - os: macos-latest
            artifact: MedarotRB-Patcher-macOS-AppleSilicon
          - os: macos-13
            artifact: MedarotRB-Patcher-macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller nsz

      # hactool decrypts the backup. SciresM ships a Windows binary; on macOS we
      # build it from source (it is small C + OpenSSL).
      - name: Fetch hactool (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/SciresM/hactool/releases/download/$env:HACTOOL_VER/hactool-$env:HACTOOL_VER-win.zip"
          Invoke-WebRequest $url -OutFile hactool.zip
          Expand-Archive hactool.zip -DestinationPath hactool_bin
          New-Item -ItemType Directory -Force tools/bin | Out-Null
          Copy-Item hactool_bin/hactool.exe tools/bin/hactool.exe

      - name: Build hactool (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          git clone --depth 1 --branch "$HACTOOL_VER" https://github.com/SciresM/hactool.git hactool_src || \
            git clone --depth 1 https://github.com/SciresM/hactool.git hactool_src
          cd hactool_src
          cp config.mk.template config.mk
          SSL="$(brew --prefix openssl@3)"
          {
            echo "CFLAGS += -I$SSL/include"
            echo "LDFLAGS += -L$SSL/lib"
          } >> config.mk
          make -j3
          cd ..
          mkdir -p tools/bin
          cp hactool_src/hactool tools/bin/hactool
          chmod +x tools/bin/hactool
          ./tools/bin/hactool --help >/dev/null 2>&1 || true

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name MedarotRB-Patcher
          --add-data "langs;langs"
          --add-binary "tools/bin/hactool.exe;tools/bin"
          --collect-all UnityPy
          --collect-all nsz
          gui.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "MedarotRB-Patcher"
          --add-data "langs:langs"
          --add-binary "tools/bin/hactool:tools/bin"
          --collect-all UnityPy
          --collect-all nsz
          gui.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/MedarotRB-Patcher.exe "${{ matrix.artifact }}.exe"

      # ditto keeps the .app bundle structure and executable bit intact.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/MedarotRB-Patcher.app" "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* \
            --title "Patcher (latest)" \
            --notes "Double-clickable patcher, built automatically from \
          ${GITHUB_SHA::7}. Pick a Switch backup (.xci/.nsp/.xcz/.nsz) or an \
          already-extracted romfs folder, pick a language, and it builds and \
          installs the mod. Windows: run the .exe (SmartScreen: 'More info' > \
          'Run anyway'). macOS: unzip, right-click the app > Open the first \
          time (it is not notarized). Decrypting a backup needs YOUR OWN \
          prod.keys; the app never contains game files or keys."

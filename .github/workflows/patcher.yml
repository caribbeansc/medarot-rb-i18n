name: patcher

# Builds the double-clickable patcher (gui.py) for Windows and macOS on every
# push to main and publishes it to the rolling "latest" release. GitHub-hosted
# runners are free for public repositories, so this costs nothing.
#
# Each executable bundles this repo's code, langs/, and a per-platform hactool
# (ISC-licensed) plus the nsz decompressor — so a player can turn their own
# .xci/.nsp/.xcz/.nsz backup into a patched game with no terminal and no keys
# setup. Nothing from the game is ever bundled.
#
# The macOS Intel runner (macos-13) is a scarce, slow-to-schedule resource, so
# it must never hold the release hostage: Windows + Apple Silicon publish first,
# and the Intel build uploads itself to the same release afterwards, best effort.

on:
  push:
    branches: [main]
    # Only rebuild when something that actually ends up in the executable
    # changes — the code, the bundled translations, or the build itself. A
    # README typo or any other doc/test edit publishes no new release.
    paths:
      - 'gui.py'
      - 'mrb.py'
      - 'medarot/**'
      - 'langs/**'
      - 'requirements.txt'
      - '.github/workflows/patcher.yml'
      - '.github/build-hactool.sh'
  workflow_dispatch:

concurrency:
  group: patcher-release
  cancel-in-progress: true

env:
  HACTOOL_VER: "1.4.0"

jobs:
  # Fast, reliable runners. These gate the release.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MedarotRB-Patcher-Windows
          - os: macos-latest
            artifact: MedarotRB-Patcher-macOS-AppleSilicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller nsz

      - name: Fetch hactool (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/SciresM/hactool/releases/download/$env:HACTOOL_VER/hactool-$env:HACTOOL_VER-win.zip"
          Invoke-WebRequest $url -OutFile hactool.zip
          Expand-Archive hactool.zip -DestinationPath hactool_bin
          New-Item -ItemType Directory -Force tools/bin | Out-Null
          Copy-Item hactool_bin/hactool.exe tools/bin/hactool.exe

      - name: Build hactool (macOS)
        if: runner.os == 'macOS'
        run: bash .github/build-hactool.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name MedarotRB-Patcher
          --add-data "langs;langs"
          --add-binary "tools/bin/hactool.exe;tools/bin"
          --collect-all UnityPy
          --collect-all nsz
          gui.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "MedarotRB-Patcher"
          --add-data "langs:langs"
          --add-binary "tools/bin/hactool:tools/bin"
          --collect-all UnityPy
          --collect-all nsz
          gui.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/MedarotRB-Patcher.exe "${{ matrix.artifact }}.exe"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/MedarotRB-Patcher.app" "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}.zip
          if-no-files-found: error

  # Publish as soon as the fast builds are done — do not wait for Intel.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest out/* --repo "$GITHUB_REPOSITORY" \
            --title "Patcher (latest)" \
            --notes "Double-clickable patcher, built automatically from \
          ${GITHUB_SHA::7}. Pick a Switch backup (.xci/.nsp/.xcz/.nsz) or an \
          already-extracted romfs folder, pick a language, and it builds and \
          installs the mod. Decrypting a backup needs YOUR OWN prod.keys; the \
          app never contains game files or keys. (The macOS Intel build is \
          added a few minutes after the others.)"

  # macOS Intel: a scarce runner, so it runs after the release exists and just
  # uploads itself to it. If it never gets a runner, the release still stands.
  intel:
    needs: release
    runs-on: macos-13
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller nsz
      - name: Build hactool
        run: bash .github/build-hactool.sh
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "MedarotRB-Patcher"
          --add-data "langs:langs"
          --add-binary "tools/bin/hactool:tools/bin"
          --collect-all UnityPy
          --collect-all nsz
          gui.py
      - name: Package
        run: ditto -c -k --keepParent "dist/MedarotRB-Patcher.app" "MedarotRB-Patcher-macOS-Intel.zip"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest "MedarotRB-Patcher-macOS-Intel.zip" --repo "$GITHUB_REPOSITORY" --clobber

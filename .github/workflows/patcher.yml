name: patcher

# Builds the double-clickable patcher (gui.py) for Windows and macOS on every
# push to main and publishes it to the rolling "latest" release. GitHub-hosted
# runners are free for public repositories, so this costs nothing.
#
# Each executable bundles this repo's code, langs/, and a per-platform hactool
# (ISC-licensed) plus the nsz decompressor — so a player can turn their own
# .xci/.nsp/.xcz/.nsz backup into a patched game with no terminal and no keys
# setup. Nothing from the game is ever bundled.
#
# Windows + Apple Silicon publish the release first; the Intel build is
# cross-compiled on the same abundant Apple Silicon runner (no scarce macos-13
# queue) and uploads itself to the release afterwards, best effort.

on:
  push:
    branches: [main]
    # Only rebuild when something that actually ends up in the executable
    # changes — the code, the bundled translations, or the build itself. A
    # README typo or any other doc/test edit publishes no new release.
    paths:
      - 'gui.py'
      - 'mrb.py'
      - 'medarot/**'
      - 'langs/**'
      - 'requirements.txt'
      - '.github/workflows/patcher.yml'
      - '.github/build-hactool.sh'
  workflow_dispatch:

concurrency:
  group: patcher-release
  cancel-in-progress: true

env:
  HACTOOL_VER: "1.4.0"

jobs:
  # Fast, reliable runners. These gate the release.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MedarotRB-Patcher-Windows
          - os: macos-latest
            artifact: MedarotRB-Patcher-macOS-AppleSilicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller nsz

      - name: Fetch hactool (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/SciresM/hactool/releases/download/$env:HACTOOL_VER/hactool-$env:HACTOOL_VER-win.zip"
          Invoke-WebRequest $url -OutFile hactool.zip
          Expand-Archive hactool.zip -DestinationPath hactool_bin
          New-Item -ItemType Directory -Force tools/bin | Out-Null
          Copy-Item hactool_bin/hactool.exe tools/bin/hactool.exe

      - name: Build hactool (macOS)
        if: runner.os == 'macOS'
        run: bash .github/build-hactool.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name MedarotRB-Patcher
          --add-data "langs;langs"
          --add-binary "tools/bin/hactool.exe;tools/bin"
          --collect-all UnityPy
          --collect-all nsz
          gui.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "MedarotRB-Patcher"
          --add-data "langs:langs"
          --add-binary "tools/bin/hactool:tools/bin"
          --collect-all UnityPy
          --collect-all nsz
          gui.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/MedarotRB-Patcher.exe "${{ matrix.artifact }}.exe"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/MedarotRB-Patcher.app" "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}.zip
          if-no-files-found: error

  # Publish as soon as the fast builds are done — do not wait for Intel. Each
  # build gets its own dated, commit-pinned tag (v<YYYY.MM.DD>-<sha>) rather
  # than a rolling 'latest', so the version history stays navigable; --latest
  # keeps /releases/latest pointing at the newest one. Same scheme as the
  # sister repo mdr-navi-i18n, for a consistent release list across both.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish a versioned release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="$(date -u +%Y.%m.%d)"
          short="${GITHUB_SHA::7}"
          tag="v${day}-${short}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # One-time migration off the old rolling 'latest' tag.
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          cat > notes.md <<EOF
          **Version ${tag}**, built from commit ${GITHUB_SHA}.

          Double-clickable patcher. Pick a Switch backup (.xci/.nsp/.xcz/.nsz) or an already-extracted romfs folder, pick a language, and it builds and installs the mod. Decrypting a backup needs YOUR OWN prod.keys; the app never contains game files or keys. (The macOS Intel build is added a few minutes after the others.)
          EOF
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --latest \
            --title "Patcher v${day} (${short})" \
            --notes-file notes.md

  # macOS Intel: cross-built on the abundant Apple Silicon runner instead of the
  # scarce macos-13, so it no longer waits in a long queue. clang targets
  # x86_64 for the C, and Rosetta runs an x86_64 Python so PyInstaller and the
  # native wheels come out Intel. Runs after the release exists and uploads
  # itself to it; best effort, so a failure never touches the published release.
  intel:
    needs: release
    runs-on: macos-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Enable Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Install a universal2 Python
        run: |
          curl -fsSL -o python.pkg \
            https://www.python.org/ftp/python/3.12.8/python-3.12.8-macos11.pkg
          sudo installer -pkg python.pkg -target /

      - name: Build hactool (x86_64)
        run: bash .github/build-hactool.sh x86_64

      - name: Build the x86_64 app
        run: |
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3
          arch -x86_64 "$PY" -m pip install --upgrade pip
          arch -x86_64 "$PY" -m pip install -r requirements.txt pyinstaller nsz
          arch -x86_64 "$PY" -m PyInstaller --noconfirm --clean --onefile --windowed \
            --target-arch x86_64 \
            --name "MedarotRB-Patcher" \
            --add-data "langs:langs" \
            --add-binary "tools/bin/hactool:tools/bin" \
            --collect-all UnityPy \
            --collect-all nsz \
            gui.py

      - name: Package
        run: ditto -c -k --keepParent "dist/MedarotRB-Patcher.app" "MedarotRB-Patcher-macOS-Intel.zip"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "MedarotRB-Patcher-macOS-Intel.zip" --repo "$GITHUB_REPOSITORY" --clobber

name: patcher

# Builds the double-clickable patcher (gui.py) for Windows and macOS on every
# push to main and publishes it to the rolling "latest" release. GitHub-hosted
# runners are free for public repositories, so this costs nothing.
#
# The executables bundle this repo's code and langs/ only — never anything
# from the game (SPEC: the user always patches their own dump).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: patcher-release
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MedarotRB-Patcher-Windows
          - os: macos-latest
            artifact: MedarotRB-Patcher-macOS-AppleSilicon
          - os: macos-13
            artifact: MedarotRB-Patcher-macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name MedarotRB-Patcher
          --add-data "langs;langs"
          --collect-all UnityPy
          gui.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "MedarotRB-Patcher"
          --add-data "langs:langs"
          --collect-all UnityPy
          gui.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/MedarotRB-Patcher.exe "${{ matrix.artifact }}.exe"

      # Zip with ditto so the .app bundle structure and permissions survive.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/MedarotRB-Patcher.app" "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* \
            --title "Patcher (latest)" \
            --notes "Double-clickable patcher, built automatically from \
          ${GITHUB_SHA::7}. Windows: run the .exe (SmartScreen: 'More info' > \
          'Run anyway'). macOS: unzip, right-click the app > Open the first \
          time (it is not notarized). The app never contains game files: it \
          patches your own dump."

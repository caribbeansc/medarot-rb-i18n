name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # No game files here, and there never will be: the suite that needs a dump
      # is marked 'game' and skipped. Everything else must pass on every platform.
      - name: Test
        run: pytest -m "not game" -q
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          coverage run --source=medarot -m pytest -m "not game" -q
          coverage report --skip-empty

  packs:
    name: language packs carry no game text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # SPEC-005/R-4: this is the check that keeps the repository redistributable.
      - run: pytest tests/test_packs.py -q
